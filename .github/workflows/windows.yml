name: Windows build and release
on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Choose version
        shell: pwsh
        run: |
          $version = '0.3.1'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME.TrimStart('v') }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Release tags must be vMAJOR.MINOR.PATCH' }
          "POWERPAL_VERSION=$version" >> $env:GITHUB_ENV
      - name: Build and test
        shell: pwsh
        run: |
          ./build.ps1 -Version $env:POWERPAL_VERSION
          $process = Start-Process "./bin/v$env:POWERPAL_VERSION/PowerPal.exe" -ArgumentList '--self-test' -PassThru -Wait
          Get-Content "./bin/v$env:POWERPAL_VERSION/test-result.txt"
          if ($process.ExitCode -ne 0) { throw 'Tests failed' }
          $windowTest = Join-Path $env:RUNNER_TEMP 'PowerPal-window-tests'
          $process = Start-Process "./bin/v$env:POWERPAL_VERSION/PowerPal.exe" -ArgumentList @('--window-test', $windowTest) -WindowStyle Hidden -PassThru -Wait
          Get-Content "$windowTest/window-result.txt"
          if ($process.ExitCode -ne 0) { throw 'Window/Settings regression failed' }
          $uiTest = Join-Path $env:RUNNER_TEMP 'PowerPal-ui-tests'
          $process = Start-Process "./bin/v$env:POWERPAL_VERSION/PowerPal.exe" -ArgumentList @('--dpi-test', $uiTest) -WindowStyle Hidden -PassThru -Wait
          Get-Content "$uiTest/ui-result.txt"
          if ($process.ExitCode -ne 0) { throw 'Typography/sort-header regression failed' }
      - name: Package
        shell: pwsh
        run: ./package.ps1 -Version $env:POWERPAL_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: PowerPal-windows-x64
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PowerPal-windows-x64
          path: dist
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME ./dist/* --repo $env:GITHUB_REPOSITORY --verify-tag --notes-file RELEASE_NOTES.md
